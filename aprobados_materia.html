<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprobados por Materia - Explotación Raíces</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="main-nav">
        <a href="index.html" class="nav-btn">🏠 Inicio</a>
        <a href="asistencia.html" class="nav-btn">Análisis de Asistencia</a>
        <a href="resultados_grupo.html" class="nav-btn">Resultados por Grupo</a>
        <a href="aprobados_materia.html" class="nav-btn active">Aprobados por Materia</a>
        <a href="https://github.com/ElenaFP/explotacion-raices/blob/main/README.md" class="nav-btn help" target="_blank">❓ Ayuda</a>
    </nav>
    <div class="container">
        <h1>📊 Aprobados por Materia</h1>
        <p class="subtitle" id="subtitle">Arrastra tu fichero CSV para analizar aprobados</p>

        <!-- Upload Section -->
        <div class="upload-section" id="uploadSection">
            <input type="file" id="csvFile" accept=".csv,.CSV" />
            <label for="csvFile" class="upload-label">
                📁 Seleccionar archivo CSV
            </label>
            <div class="file-info" id="fileInfo">
                o arrastra el archivo aquí
            </div>
        </div>

        <div class="loading" id="loader">
            <div class="spinner"></div>
            <p>Procesando datos...</p>
        </div>

        <!-- Controls (Tabs for Courses) -->
        <div class="tabs" id="courseTabs" style="display:none; justify-content: center; margin-bottom: 30px;">
            <!-- Tabs injected via JS -->
        </div>

        <!-- Results Interface -->
        <div id="results">
            <div class="results-header">
                <h2 id="year-title" class="table-title">Resultados</h2>
                <button class="download-btn" onclick="downloadCSV()">
                    ⬇️ Descargar CSV
                </button>
            </div>
            <table id="stats-table">
                <thead>
                    <tr>
                        <!-- Headers will be injected via JS -->
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/notas_materia.js"></script>
</body>
</html>
